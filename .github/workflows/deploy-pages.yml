name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 平台源码
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
      AMAP_SECURITY_JS_CODE: ${{ secrets.AMAP_SECURITY_JS_CODE }}
      CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 平台源码/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages integration
        run: npm run test:pages

      - name: Check types
        run: npm run typecheck

      - name: Check code style
        run: npm run lint

      - name: Build static website
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 平台源码/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
