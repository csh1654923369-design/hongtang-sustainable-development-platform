<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hongtang 3DGS Cesium ion Viewer</title>
  <script src="https://unpkg.com/cesium@latest/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/cesium@latest/Build/Cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #panel {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 1;
      width: min(430px, calc(100vw - 24px));
      padding: 10px;
      border-radius: 8px;
      background: rgba(20, 24, 28, 0.86);
      color: #f5f7fb;
      font-size: 13px;
      line-height: 1.35;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
    }
    #status {
      margin-bottom: 8px;
      color: #d8e3f0;
    }
    .row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .row.compact {
      grid-template-columns: 1fr 1fr 1fr;
    }
    .align-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .align-grid label {
      display: grid;
      gap: 4px;
      white-space: normal;
    }
    label {
      color: #d8e3f0;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 8px;
      font: inherit;
    }
    button {
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 6px 8px;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .checks label {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    #buildingInfo {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      color: #d8e3f0;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 5px 8px;
      margin-top: 6px;
    }
    .info-value {
      color: #fff;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="panel">
    <div id="status">Loading ion asset 4908525</div>
    <div class="row">
      <label for="heightOffset">高度偏移 m</label>
      <input id="heightOffset" type="number" step="1" value="0" />
    </div>
    <div class="align-grid">
      <label for="eastOffset">东移 m<input id="eastOffset" type="number" step="0.1" value="0" /></label>
      <label for="northOffset">北移 m<input id="northOffset" type="number" step="0.1" value="0" /></label>
      <label for="yawOffset">旋转 °<input id="yawOffset" type="number" step="0.01" value="0" /></label>
    </div>
    <div class="row compact">
      <button id="applyOffset" type="button">应用配准</button>
      <button id="suggestOffset" type="button">估算贴地</button>
      <button id="zoomModel" type="button">回到模型</button>
    </div>
    <div class="checks">
      <label><input id="terrainToggle" type="checkbox" checked /> 3D地形</label>
      <label><input id="depthToggle" type="checkbox" /> 地形遮挡</label>
      <label><input id="gaussianToggle" type="checkbox" checked /> 高斯模型</label>
      <label><input id="whiteModelToggle" type="checkbox" checked /> 白模</label>
    </div>
    <div id="buildingInfo">
      <div>建筑属性</div>
      <div class="info-grid">
        <div>户主</div>
        <div id="ownerValue" class="info-value">-</div>
        <div>建筑高度</div>
        <div id="heightValue" class="info-value">-</div>
      </div>
    </div>
  </div>
  <script type="module">
    const ION_ASSET_ID = 4908525;
    const MODEL_ORIGIN = { lon: 99.908740607, lat: 24.636255278, height: 1764.0 };
    const buildingsUrl = "./building_footprints.geojson";
    const WHITE_MODEL_HEIGHT = 9;
    const DEFAULT_ION_TOKEN = "";
    const HEIGHT_OFFSET_KEY = "HONGTANG_ION_HEIGHT_OFFSET";
    const MODEL_ALIGNMENT_KEY = "HONGTANG_ION_MODEL_ALIGNMENT";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("ionToken") || localStorage.getItem("CESIUM_ION_TOKEN") || DEFAULT_ION_TOKEN;
    Cesium.Ion.defaultAccessToken = token;
    localStorage.setItem("CESIUM_ION_TOKEN", token);

    const status = document.getElementById("status");
    const heightOffsetInput = document.getElementById("heightOffset");
    const eastOffsetInput = document.getElementById("eastOffset");
    const northOffsetInput = document.getElementById("northOffset");
    const yawOffsetInput = document.getElementById("yawOffset");
    const terrainToggle = document.getElementById("terrainToggle");
    const depthToggle = document.getElementById("depthToggle");
    const gaussianToggle = document.getElementById("gaussianToggle");
    const whiteModelToggle = document.getElementById("whiteModelToggle");
    const applyOffsetButton = document.getElementById("applyOffset");
    const suggestOffsetButton = document.getElementById("suggestOffset");
    const zoomModelButton = document.getElementById("zoomModel");
    const ownerValue = document.getElementById("ownerValue");
    const heightValue = document.getElementById("heightValue");

    const savedAlignment = JSON.parse(localStorage.getItem(MODEL_ALIGNMENT_KEY) || "{}");
    heightOffsetInput.value =
      params.get("heightOffset") ?? savedAlignment.height ?? localStorage.getItem(HEIGHT_OFFSET_KEY) ?? "0";
    eastOffsetInput.value = params.get("eastOffset") ?? savedAlignment.east ?? "0";
    northOffsetInput.value = params.get("northOffset") ?? savedAlignment.north ?? "0";
    yawOffsetInput.value = params.get("yawOffset") ?? savedAlignment.yaw ?? "0";

    const viewer = new Cesium.Viewer("cesiumContainer", {
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      animation: false,
      timeline: false,
      geocoder: false,
      homeButton: true,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
    });

    viewer.scene.globe.depthTestAgainstTerrain = depthToggle.checked;
    viewer.scene.globe.enableLighting = false;

    let tileset;
    let buildingDataSource;
    let activeTerrainProvider = viewer.terrainProvider;
    const scratchTime = Cesium.JulianDate.now();

    function setStatus(text) {
      status.textContent = text;
    }

    function withTimeout(promise, timeoutMs, message) {
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          window.setTimeout(() => reject(new Error(message)), timeoutMs);
        }),
      ]);
    }

    const originCartesian = Cesium.Cartesian3.fromDegrees(
      MODEL_ORIGIN.lon,
      MODEL_ORIGIN.lat,
      MODEL_ORIGIN.height
    );
    const originEnu = Cesium.Transforms.eastNorthUpToFixedFrame(originCartesian);
    const originEnuInverse = Cesium.Matrix4.inverse(originEnu, new Cesium.Matrix4());

    function modelAlignmentMatrix(eastMeters, northMeters, upMeters, yawDegrees) {
      const localTranslation = Cesium.Matrix4.fromTranslation(
        new Cesium.Cartesian3(eastMeters, northMeters, upMeters)
      );
      const localRotation = Cesium.Matrix4.fromRotationTranslation(
        Cesium.Matrix3.fromRotationZ(Cesium.Math.toRadians(yawDegrees))
      );
      const localTransform = Cesium.Matrix4.multiply(
        localTranslation,
        localRotation,
        new Cesium.Matrix4()
      );
      return Cesium.Matrix4.multiply(
        Cesium.Matrix4.multiply(originEnu, localTransform, new Cesium.Matrix4()),
        originEnuInverse,
        new Cesium.Matrix4()
      );
    }

    function verticalOffsetMatrix(offsetMeters) {
      const from = Cesium.Cartesian3.fromDegrees(
        MODEL_ORIGIN.lon,
        MODEL_ORIGIN.lat,
        MODEL_ORIGIN.height
      );
      const to = Cesium.Cartesian3.fromDegrees(
        MODEL_ORIGIN.lon,
        MODEL_ORIGIN.lat,
        MODEL_ORIGIN.height + offsetMeters
      );
      const translation = Cesium.Cartesian3.subtract(to, from, new Cesium.Cartesian3());
      return Cesium.Matrix4.fromTranslation(translation);
    }

    function applyHeightOffset() {
      if (!tileset) return;
      const height = Number(heightOffsetInput.value || 0);
      const east = Number(eastOffsetInput.value || 0);
      const north = Number(northOffsetInput.value || 0);
      const yaw = Number(yawOffsetInput.value || 0);
      tileset.modelMatrix = modelAlignmentMatrix(east, north, height, yaw);
      localStorage.setItem(HEIGHT_OFFSET_KEY, String(height));
      localStorage.setItem(MODEL_ALIGNMENT_KEY, JSON.stringify({ height, east, north, yaw }));
      setStatus(
        `Ion asset loaded, E ${east.toFixed(1)} m, N ${north.toFixed(1)} m, H ${height.toFixed(1)} m, R ${yaw.toFixed(2)}°`
      );
    }

    function getEntityProperty(entity, name, fallback = "") {
      const property = entity.properties?.[name];
      if (!property) return fallback;
      const value = property.getValue ? property.getValue(scratchTime) : property;
      return value ?? fallback;
    }

    function formatHeight(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(1)} m` : "-";
    }

    function showBuildingInfo(entity) {
      ownerValue.textContent = getEntityProperty(entity, "owner", "") || "-";
      heightValue.textContent = formatHeight(WHITE_MODEL_HEIGHT);
    }

    function styleBuildingEntity(entity) {
      if (!entity.polygon) return;
      entity.properties = entity.properties || new Cesium.PropertyBag();
      entity.properties.addProperty("isBuildingWhiteModel");
      entity.properties.isBuildingWhiteModel = true;
      entity.polygon.material = Cesium.Color.WHITE.withAlpha(0.06);
      entity.polygon.outline = true;
      entity.polygon.outlineColor = Cesium.Color.WHITE.withAlpha(0.42);
      entity.polygon.height = WHITE_MODEL_HEIGHT;
      entity.polygon.heightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
      entity.polygon.extrudedHeight = 0;
      entity.polygon.extrudedHeightReference = Cesium.HeightReference.RELATIVE_TO_GROUND;
      entity.polygon.closeTop = true;
      entity.polygon.closeBottom = true;
      entity.polygon.shadows = Cesium.ShadowMode.DISABLED;
    }

    async function loadBuildingWhiteModels() {
      try {
        buildingDataSource = await Cesium.GeoJsonDataSource.load(buildingsUrl, {
          clampToGround: false,
        });
        for (const entity of buildingDataSource.entities.values) {
          styleBuildingEntity(entity);
        }
        await viewer.dataSources.add(buildingDataSource);
        setStatus(`Loaded ${buildingDataSource.entities.values.length} building footprints`);
      } catch (error) {
        setStatus(`Building footprints unavailable: ${error.message}`);
      }
    }

    function applyVisibility() {
      if (tileset) tileset.show = gaussianToggle.checked;
      if (buildingDataSource) buildingDataSource.show = whiteModelToggle.checked;
    }

    async function enableTerrain(enabled) {
      if (!enabled) {
        activeTerrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewer.terrainProvider = activeTerrainProvider;
        setStatus("3D terrain off");
        return;
      }
      try {
        setStatus("Loading 3D terrain");
        if (Cesium.createWorldTerrainAsync) {
          activeTerrainProvider = await withTimeout(
            Cesium.createWorldTerrainAsync({
              requestVertexNormals: true,
              requestWaterMask: true,
            }),
            10000,
            "Cesium ion terrain timed out"
          );
          viewer.terrainProvider = activeTerrainProvider;
        } else if (Cesium.Terrain?.fromWorldTerrain && viewer.scene.setTerrain) {
          const terrain = Cesium.Terrain.fromWorldTerrain({
            requestVertexNormals: true,
            requestWaterMask: true,
          });
          viewer.scene.setTerrain(terrain);
          activeTerrainProvider = await withTimeout(
            new Promise((resolve, reject) => {
              let removeReady = () => {};
              let removeError = () => {};
              removeReady = terrain.readyEvent.addEventListener((provider) => {
                removeReady();
                removeError();
                resolve(provider);
              });
              removeError = terrain.errorEvent.addEventListener((event) => {
                removeReady();
                removeError();
                reject(event.error || event);
              });
            }),
            10000,
            "Cesium ion terrain timed out"
          );
        } else {
          throw new Error("Cesium World Terrain API not found");
        }
        setStatus("3D terrain ready");
        applyHeightOffset();
      } catch (error) {
        terrainToggle.checked = false;
        activeTerrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewer.terrainProvider = activeTerrainProvider;
        setStatus(`3D terrain unavailable: ${error.message}`);
      }
    }

    async function suggestHeightOffset() {
      if (!tileset || activeTerrainProvider instanceof Cesium.EllipsoidTerrainProvider) {
        setStatus("Turn on 3D terrain before estimating");
        return;
      }
      try {
        setStatus("Sampling terrain");
        const center = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);
        const samples = await Cesium.sampleTerrainMostDetailed(activeTerrainProvider, [center]);
        const suggested = samples[0].height - center.height;
        heightOffsetInput.value = suggested.toFixed(1);
        applyHeightOffset();
      } catch (error) {
        setStatus(`Terrain sample failed: ${error.message}`);
      }
    }

    terrainToggle.addEventListener("change", () => enableTerrain(terrainToggle.checked));
    depthToggle.checked = true;
    viewer.scene.globe.depthTestAgainstTerrain = depthToggle.checked;
    depthToggle.addEventListener("change", () => {
      viewer.scene.globe.depthTestAgainstTerrain = depthToggle.checked;
    });
    gaussianToggle.addEventListener("change", applyVisibility);
    whiteModelToggle.addEventListener("change", applyVisibility);
    applyOffsetButton.addEventListener("click", applyHeightOffset);
    heightOffsetInput.addEventListener("change", applyHeightOffset);
    eastOffsetInput.addEventListener("change", applyHeightOffset);
    northOffsetInput.addEventListener("change", applyHeightOffset);
    yawOffsetInput.addEventListener("change", applyHeightOffset);
    suggestOffsetButton.addEventListener("click", suggestHeightOffset);
    zoomModelButton.addEventListener("click", () => {
      if (tileset) viewer.zoomTo(tileset);
    });

    viewer.screenSpaceEventHandler.setInputAction((movement) => {
      const picks = viewer.scene.drillPick(movement.position, 12);
      const building = picks
        .map((pick) => pick.id)
        .find((entity) => entity?.properties?.isBuildingWhiteModel);
      if (building) {
        showBuildingInfo(building);
        viewer.selectedEntity = building;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    try {
      await loadBuildingWhiteModels();
      tileset = await Cesium.Cesium3DTileset.fromIonAssetId(ION_ASSET_ID, {
        maximumScreenSpaceError: 16,
        dynamicScreenSpaceError: true,
      });
      viewer.scene.primitives.add(tileset);
      tileset.allTilesLoaded.addEventListener(() => applyHeightOffset());
      applyHeightOffset();
      applyVisibility();
      await viewer.zoomTo(tileset);
      if (terrainToggle.checked) {
        enableTerrain(true);
      }
    } catch (error) {
      setStatus(`Ion asset failed: ${error.message}`);
      throw error;
    }
  </script>
</body>
</html>
