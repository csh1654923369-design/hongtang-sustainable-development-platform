<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>红塘村高斯模型 · Spark 流式 LoD 测试</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: #f8f5eb;
      background: radial-gradient(circle at 50% 30%, #375947 0, #17231d 62%, #0b110e 100%);
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .status {
      position: fixed;
      left: 18px;
      top: 18px;
      z-index: 2;
      max-width: min(420px, calc(100vw - 36px));
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      background: rgba(13, 22, 17, .78);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.55;
    }
    .status strong { display: block; margin-bottom: 2px; font-size: 14px; }
    .help {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      padding: 8px 11px;
      border-radius: 8px;
      color: rgba(255,255,255,.82);
      background: rgba(13, 22, 17, .72);
      font-size: 12px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="status" id="status">
    <strong>正在载入红塘村流式模型</strong>
    <span id="statusText">先读取 54 KB 索引，再按当前视角加载所需分块。</span>
  </div>
  <div class="help">左键平移 · 右键旋转 · 滚轮缩放</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { SparkRenderer, SplatMesh, isMobile } from "@sparkjsdev/spark";

    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 4000);
    camera.position.set(10, 440, 860);

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile() ? 1 : 1.4));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const spark = new SparkRenderer({
      renderer,
      pagedExtSplats: true,
      maxPagedSplats: (isMobile() ? 32 : 64) * 65536,
      lodSplatScale: isMobile() ? 0.22 : 0.35,
      behindFoveate: 0.15,
      coneFov0: 70,
      coneFov: 150,
      coneFoveate: 0.35
    });
    scene.add(spark);

    const halfPi = Math.PI / 2;
    const modelCenter = new THREE.Vector3(-121.9575, 86.009, -110.5815);
    const sourceToThree = new THREE.Quaternion().setFromAxisAngle(
      new THREE.Vector3(1, 0, 0),
      -halfPi
    );
    const centeredPosition = modelCenter.clone().applyQuaternion(sourceToThree).multiplyScalar(-1);

    const splats = new SplatMesh({
      url: "./hongtang-recovered-sh0-lod.rad",
      paged: true,
      lodScale: 1,
      onProgress(event) {
        if (event.lengthComputable && event.total > 0) {
          statusText.textContent = `当前请求已载入 ${Math.round(event.loaded / event.total * 100)}%。`;
        }
      },
      onLoad() {
        document.documentElement.dataset.sparkReady = "true";
        status.querySelector("strong").textContent = "流式模型已就绪";
        statusText.textContent = "系统会随视角移动继续补充细节，不会一次性把全部模型压入显存。";
        setTimeout(() => status.style.opacity = ".72", 1600);
      }
    });
    splats.quaternion.copy(sourceToThree);
    splats.position.copy(centeredPosition);
    scene.add(splats);

    splats.initialized.catch((error) => {
      console.error(error);
      document.documentElement.dataset.sparkError = String(error);
      status.querySelector("strong").textContent = "模型加载失败";
      statusText.textContent = String(error?.message || error);
    });

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;
    controls.panSpeed = 0.75;
    controls.rotateSpeed = 0.45;
    controls.zoomSpeed = 1.15;
    controls.minDistance = 40;
    controls.maxDistance = 1800;
    controls.mouseButtons.LEFT = THREE.MOUSE.PAN;
    controls.mouseButtons.MIDDLE = null;
    controls.mouseButtons.RIGHT = THREE.MOUSE.ROTATE;
    controls.update();

    addEventListener("contextmenu", event => event.preventDefault());
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile() ? 1 : 1.4));
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
